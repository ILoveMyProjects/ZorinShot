name: Build and release Zorin Shot

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin nodejs desktop-file-utils

      - name: Validate tag against VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '\n\r ' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)."
            exit 1
          fi

      - name: Build release ZIP, checksum and update manifest
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 tools/build_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zorin-shot-${{ github.sha }}
          path: |
            dist/zorin-shot-*.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
            dist/update.json

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$(find dist -maxdepth 1 -type f -name 'zorin-shot-*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Release ZIP not found"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" dist/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Zorin Shot $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ZIP" \
              dist/SHA256SUMS \
              --title "Zorin Shot $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Publish stable update.json on default branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp dist/update.json /tmp/zorin-shot-update.json

          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp /tmp/zorin-shot-update.json update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json

          if ! git diff --cached --quiet; then
            git commit -m "Update release manifest to $GITHUB_REF_NAME"
            git push origin "HEAD:$DEFAULT_BRANCH"
          else
            echo "update.json already points to $GITHUB_REF_NAME"
          fi
